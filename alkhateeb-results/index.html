<!doctype html>
<html lang="ar" dir="rtl">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>بيانات ونتيجة الطلاب - مدرسة الشهيد محمود علي الخطيب</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800&display=swap"
      rel="stylesheet"
    />
    <script
      src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.9.2/dist/confetti.browser.min.js"
      defer
    ></script>
    <script
      src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"
      defer
    ></script>
    <meta
      property="og:title"
      content="بيانات ونتيجة الطلاب - مدرسة الشهيد محمود علي الخطيب"
    />
    <meta
      property="og:description"
      content="بوابة الاستعلام عن بيانات ونتيجة الطالب"
    />
    <meta
      property="og:image"
      content="https://mosamirhelal.com/alkhateeb-results/images/logo_3.webp"
    />
    <meta property="og:type" content="website" />
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <div
      class="dot"
      style="
        width: 90px;
        height: 90px;
        top: 8%;
        left: 4%;
        animation-duration: 6s;
      "
    ></div>
    <div
      class="dot"
      style="
        width: 60px;
        height: 60px;
        top: 20%;
        right: 6%;
        animation-duration: 8s;
        animation-delay: 1s;
      "
    ></div>
    <div
      class="dot"
      style="
        width: 120px;
        height: 120px;
        top: 55%;
        left: 2%;
        animation-duration: 10s;
        animation-delay: 2s;
      "
    ></div>
    <div
      class="dot"
      style="
        width: 50px;
        height: 50px;
        top: 70%;
        right: 4%;
        animation-duration: 7s;
        animation-delay: 0.5s;
      "
    ></div>
    <div
      class="dot"
      style="
        width: 80px;
        height: 80px;
        top: 38%;
        right: 11%;
        animation-duration: 9s;
        animation-delay: 3s;
      "
    ></div>

    <div class="container">
      <div class="top-logos">
        <img src="images/logo_2.webp" alt="شعار وزارة التربية والتعليم" />
        <img src="images/logo_1.webp" alt="شعار مدرسة الشهيد محمود علي الخطيب" />
      </div>
      <div class="header-image">
        <img
          src="images/logo_3.webp"
          alt="مدرسة الشهيد محمود علي الخطيب الرسمية للغات"
        />
      </div>
      <h2>بيانات ونتيجة الطلاب</h2>
      <div class="input-group">
        <span class="input-group-icon">👤</span>
        <input
          type="text"
          inputmode="text"
          maxlength="50"
          id="studentIdInput"
          class="form-control"
          placeholder="أدخل رقم الطالب أو الاسم"
        />
      </div>
      <button
        onclick="
          addRipple(event, this);
          getGrade();
        "
        id="searchBtn"
        class="form-control pulse-button"
      >
        <span class="btn-text">🔎 بحث</span>
      </button>
      <div class="loader" id="loader"></div>
      <div id="nameSearchResults"></div>
      <div id="result"></div>
      <div class="designer-credit">تصميم وتنفيذ : سمير هلال</div>
    </div>
    <div class="visit-counter">
      عدد زيارات الموقع : <span id="visitCount">...</span>
    </div>

    <script src="script.js" defer></script>
  </body>
</html>
