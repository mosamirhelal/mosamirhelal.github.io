    <style>
      * {
        box-sizing: border-box;
      }
      body {
        font-family: "Cairo", sans-serif;
        text-align: center;
        margin: 0;
        padding: 40px 20px;
        background-color: #c9d0d9;
        animation: fadeInPage 0.55s ease-out;
        overflow-x: hidden;
        min-height: 100vh;
        display: flex;
        flex-direction: column;
        align-items: center;
      }
      @keyframes fadeInPage {
        from {
          opacity: 0;
        }
        to {
          opacity: 1;
        }
      }
      @keyframes slideInUp {
        from {
          opacity: 0;
          transform: translateY(30px);
        }
        to {
          opacity: 1;
          transform: translateY(0);
        }
      }
      @keyframes fadeIn {
        from {
          opacity: 0;
        }
        to {
          opacity: 1;
        }
      }
      @keyframes floatDot {
        0%,
        100% {
          transform: translateY(0);
        }
        50% {
          transform: translateY(-18px);
        }
      }
      @keyframes popIn {
        0% {
          opacity: 0;
          transform: scale(0.85);
        }
        70% {
          transform: scale(1.04);
        }
        100% {
          opacity: 1;
          transform: scale(1);
        }
      }
      @keyframes rowIn {
        from {
          opacity: 0;
          transform: translateX(-12px);
        }
        to {
          opacity: 1;
          transform: translateX(0);
        }
      }
      @keyframes pulseGlow {
        0% {
          transform: scale(1);
          box-shadow: 0 0 0 0 rgba(0, 86, 179, 0.7);
        }
        70% {
          transform: scale(1.02);
          box-shadow: 0 0 0 15px rgba(0, 86, 179, 0);
        }
        100% {
          transform: scale(1);
          box-shadow: 0 0 0 0 rgba(0, 86, 179, 0);
        }
      }
      @keyframes spin {
        100% {
          transform: rotate(360deg);
        }
      }
      @keyframes ripple {
        from {
          transform: scale(0);
          opacity: 1;
        }
        to {
          transform: scale(3.5);
          opacity: 0;
        }
      }
      .dot {
        position: fixed;
        border-radius: 50%;
        pointer-events: none;
        z-index: 0;
        background: rgba(0, 86, 179, 0.05);
        animation: floatDot ease-in-out infinite;

      .container {

      .form-control {

        font-family: inherit;

      .input-group {

        font-size: 18px;

    <script>
      function escapeHTML(str) {
        if (str === null || str === undefined) return "";
        return String(str).replace(/[&<>'"]/g, function (tag) {
          const charsToReplace = {
            "&": "&amp;",
            "<": "&lt;",
            ">": "&gt;",
            "'": "&#39;",
            '"': "&quot;",
          };
          return charsToReplace[tag] || tag;
        });
      }

      fetch("https://api.counterapi.dev/v1/alkhateeb-students/visits/up")
        .then((res) => res.json())
        .then((data) => {
          document.getElementById("visitCount").innerText =
            data.count.toLocaleString("ar-EG");
        })
        .catch(() => {
          document.getElementById("visitCount").innerText = "-";
        });

      document
        .getElementById("studentIdInput")
        .addEventListener("keypress", function (event) {
          if (event.key === "Enter") {
            event.preventDefault();
            const btn = document.getElementById("searchBtn");
            addRipple(event, btn);
            getGrade();
          }
        });

      function addRipple(e, btn) {
        const rect = btn.getBoundingClientRect();
        let x, y;
        if (e.clientX !== undefined && e.clientX !== 0) {
          x = e.clientX - rect.left;
          y = e.clientY - rect.top;
        } else if (e.touches && e.touches.length > 0) {
          x = e.touches[0].clientX - rect.left;
          y = e.touches[0].clientY - rect.top;
        } else {
          x = rect.width / 2;
          y = rect.height / 2;
        }
        const size = Math.max(rect.width, rect.height);
        const span = document.createElement("span");
        span.className = "ripple-span";
        span.style.width = span.style.height = size + "px";
        span.style.left = x - size / 2 + "px";
        span.style.top = y - size / 2 + "px";
        btn.appendChild(span);
        setTimeout(() => span.remove(), 600);
      }

      function toggleFeedbackForm() {
        document.getElementById("showFeedbackBtn").style.display = "none";
        var formContainer = document.getElementById("feedbackFormContainer");
        formContainer.style.display = "block";
        formContainer.style.animation = "fadeIn 0.5s ease-out forwards";
        setTimeout(() => {
          window.scrollTo({
            top: document.body.scrollHeight,
            behavior: "smooth",
          });
          document.getElementById("feedbackInput").focus();
        }, 100);
      }

      function resetSearch() {
        document.getElementById("result").innerHTML = "";
        document.getElementById("nameSearchResults").innerHTML = "";
        var natIdInput = document.getElementById("studentIdInput");
        natIdInput.value = "";
        window.scrollTo({ top: 0, behavior: "smooth" });
        setTimeout(() => natIdInput.focus(), 500);
      }

      function sendFeedback(studentName, seatNumber, studentGrade) {
        var feedbackText = document.getElementById("feedbackInput").value;
        var btn = document.getElementById("submitFeedbackBtn");
        var btnText = btn.querySelector(".btn-text");
        var statusMsg = document.getElementById("feedbackStatus");
        var feedbackTitle = document.getElementById("feedbackTitle");

        if (!feedbackText.trim()) {
          statusMsg.innerHTML =
            "<span style='color: red;'>الرجاء كتابة رسالتك أولاً.</span>";
          return;
        }

        btn.disabled = true;
        btnText.innerText = "⏳ جاري الإرسال...";
        statusMsg.innerHTML = "";

        var url =
          "https://script.google.com/macros/s/AKfycbwBTXJdYieo6LWZCs-bNKkYpU_ASyifPdj9ZxXueL272ygjDQVcScwUl9L3WBboplfCCQ/exec";

        var payload = {
          action: "submitFeedback",
          studentName: studentName,
          seatNumber: seatNumber,
          studentGrade: studentGrade,
          feedbackText: feedbackText,
        };

        fetch(url, {
          method: "POST",
          headers: { "Content-Type": "text/plain;charset=utf-8" },
          body: JSON.stringify(payload),
        })
          .then((response) => response.json())
          .then((data) => {
            if (data.status === "success") {
              btnText.innerText = "✅ تم الإرسال بنجاح!";
              statusMsg.innerHTML =
                "<span style='color: green;'>شكراً لك! تم إرسال رسالتك للإدارة.</span>";
              setTimeout(() => {
                btn.style.display = "none";
                feedbackTitle.style.display = "none";
                document.getElementById("feedbackInput").style.display = "none";
                statusMsg.innerHTML =
                  "<span style='color: green; display: block; margin-bottom: 15px;'>شكراً لك! تم إرسال رسالتك للإدارة.</span>" +
                  "<button class='form-control' style='background-color: #890620; color: white;' onclick='addRipple(event,this); resetSearch()'><span class='btn-text'>🔄 للبحث عن طالب آخر</span></button>";
              }, 1500);
            } else {
              throw new Error("فشل الحفظ");
            }
          })
          .catch(() => {
            btn.disabled = false;
            btnText.innerText = "📨 إرسال الرسالة";
            statusMsg.innerHTML =
              "<span style='color: red;'>حدث خطأ، يرجى المحاولة لاحقاً.</span>";
          });
      }

      async function shareResult(studentName) {
        var captureDiv = document.getElementById("capture-area");
        var shareBtn = document.getElementById("shareBtn");
        var btnText = shareBtn.querySelector(".btn-text");
        var originalText = btnText.innerText;

        btnText.innerText = "⏳ جاري تحضير الصورة...";
        shareBtn.disabled = true;

        try {
          const canvas = await html2canvas(captureDiv, {
            scale: 2,
            useCORS: true,
            backgroundColor: "#ffffff",
            scrollY: -window.scrollY,
            onclone: function (clonedDoc) {
              var noAnimStyle = clonedDoc.createElement("style");
              noAnimStyle.innerHTML =
                "* { animation: none !important; transition: none !important; opacity: 1 !important; transform: none !important; }";
              clonedDoc.head.appendChild(noAnimStyle);
              var clonedArea = clonedDoc.getElementById("capture-area");
              clonedArea.style.width = "800px";
              clonedArea.style.maxWidth = "none";
              clonedArea.style.padding = "40px";
              clonedArea.style.margin = "0 auto";
              clonedArea.style.overflow = "visible";
              clonedDoc.getElementById("export-header").style.display = "block";
              clonedDoc.getElementById("export-footer").style.display = "block";
            },
          });

          const blob = await new Promise((resolve) =>
            canvas.toBlob(resolve, "image/png")
          );
          let count = parseInt(localStorage.getItem("shareCount") || "0") + 1;
          localStorage.setItem("shareCount", count);
          const fileName = `بيانات_${studentName}_${count}.png`;
          const file = new File([blob], fileName, { type: "image/png" });
          const isMobile = /Android|iPhone|iPad|iPod/i.test(
            navigator.userAgent
          );

          if (
            isMobile &&
            navigator.canShare &&
            navigator.canShare({ files: [file] })
          ) {
            try {
              await navigator.share({
                title: `بيانات ${studentName}`,
                text: `بيانات ورقم جلوس الطالب ${studentName} - مدرسة الشهيد محمود علي الخطيب`,
                files: [file],
              });
            } catch (err) {}
            btnText.innerText = originalText;
            shareBtn.disabled = false;
          } else {
            const link = document.createElement("a");
            link.href = URL.createObjectURL(blob);
            link.download = fileName;
            document.body.appendChild(link);
            link.click();
            document.body.removeChild(link);
            shareBtn.style.backgroundColor = "#28a745";
            btnText.innerText = "✅ تم مشاركة الصورة بنجاح!";
            setTimeout(() => {
              shareBtn.style.backgroundColor = "";
              btnText.innerText = originalText;
              shareBtn.disabled = false;
            }, 5000);
          }
        } catch (error) {
          btnText.innerText = originalText;
          shareBtn.disabled = false;
          alert("حدث خطأ أثناء تحضير الصورة");
        }
      }

      function searchByName(nameQuery) {
        var idInput = document.getElementById("studentIdInput");
        var resultDiv = document.getElementById("result");
        var nameSearchResultsDiv = document.getElementById("nameSearchResults");
        var loader = document.getElementById("loader");
        var searchBtn = document.getElementById("searchBtn");
        var searchBtnText = searchBtn.querySelector(".btn-text");

        resultDiv.innerHTML = "";
        nameSearchResultsDiv.innerHTML = "";

        idInput.blur();
        loader.style.display = "block";
        searchBtn.disabled = true;
        idInput.disabled = true;
        searchBtn.classList.remove("pulse-button");
        searchBtnText.innerText = "⏳ جاري البحث...";

        var url =
          "https://script.google.com/macros/s/AKfycbwBTXJdYieo6LWZCs-bNKkYpU_ASyifPdj9ZxXueL272ygjDQVcScwUl9L3WBboplfCCQ/exec?name=" +
          encodeURIComponent(nameQuery);

        fetch(url)
          .then((response) => response.json())
          .then((data) => {
            if (data.status === "success") {
              if (data.results.length === 1) {
                selectStudentAndSearch(data.results[0].seatNum);
                return;
              }
              
              var html = "";
              data.results.forEach((student, index) => {
                var delay = 0.08 * (index + 1);
                var safeName = escapeHTML(student.name);
                var safeGrade = escapeHTML(student.grade);
                var safeSeatNum = escapeHTML(student.seatNum);

                html += `
                  <div class="name-card" style="animation-delay: ${delay}s">
                    <p class="name-card-title">${safeName}</p>
                    <p class="name-card-subtitle">الصف: ${safeGrade}</p>
                    <p class="name-card-id">رقم الجلوس: ${safeSeatNum}</p>
                    <button class="form-control name-card-btn" onclick="addRipple(event,this); selectStudentAndSearch('${safeSeatNum}')">
                      <span class="btn-text">📊 عرض البيانات واللجنة</span>
                    </button>
                  </div>
                `;
              });
              nameSearchResultsDiv.innerHTML = html;
            } else {
              nameSearchResultsDiv.innerHTML = `<div style='color:red; margin-top:15px; font-weight:bold;' class='student-info-appear'>${escapeHTML(
                data.message
              )}</div>`;
            }
            setTimeout(() => {
              if(data.results && data.results.length > 1) {
                window.scrollTo({
                  top: nameSearchResultsDiv.offsetTop - 20,
                  behavior: "smooth",
                });
              }
            }, 200);
          })
          .catch(() => {
            nameSearchResultsDiv.innerHTML =
              "<div style='color:red; margin-top:15px;' class='student-info-appear'>حدث خطأ في الاتصال بقاعدة البيانات. تأكد من اتصالك بالإنترنت.</div>";
          })
          .finally(() => {
            if(document.getElementById("studentIdInput").value === nameQuery) {
              loader.style.display = "none";
              searchBtn.disabled = false;
              idInput.disabled = false;
              searchBtn.classList.add("pulse-button");
              searchBtnText.innerText = "🔎 بحث";
            }
          });
      }

      function getGrade() {
        var idInput = document.getElementById("studentIdInput");
        var id = idInput.value;
        var resultDiv = document.getElementById("result");
        var nameSearchResultsDiv = document.getElementById("nameSearchResults");
        var loader = document.getElementById("loader");
        var searchBtn = document.getElementById("searchBtn");
        var searchBtnText = searchBtn.querySelector(".btn-text");

        resultDiv.innerHTML = "";
        nameSearchResultsDiv.innerHTML = "";

        if (!id) {
          resultDiv.innerHTML =
            "<div style='color:red; margin-top:15px;' class='student-info-appear'>الرجاء إدخال رقم الجلوس أو الاسم أولاً</div>";
          return;
        }

        const isNumeric = /^\d+$/.test(id.trim());
        if (!isNumeric) {
          searchByName(id.trim());
          return;
        }

        idInput.blur();

        loader.style.display = "block";
        searchBtn.disabled = true;
        idInput.disabled = true;
        searchBtn.classList.remove("pulse-button");
        searchBtnText.innerText = "⏳ جاري البحث...";

        var url =
          "https://script.google.com/macros/s/AKfycbwBTXJdYieo6LWZCs-bNKkYpU_ASyifPdj9ZxXueL272ygjDQVcScwUl9L3WBboplfCCQ/exec?id=" +
          encodeURIComponent(id);

        fetch(url)
          .then((response) => response.json())
          .then((data) => {
            loader.style.display = "none";
            searchBtn.disabled = false;
            idInput.disabled = false;
            searchBtn.classList.add("pulse-button");
            searchBtnText.innerText = "🔎 بحث";

            if (data.status === "success") {
              if (data.resultsHidden === true) {
                resultDiv.innerHTML = `
                  <div class="student-info-appear">
                    <div id="capture-area">
                      <h3 class="student-name">الاسم: ${escapeHTML(
                        data.name
                      )}</h3>
                      <div class="status-message fail-message" style="margin-top: 20px;">
                        ⏳ ${escapeHTML(data.message)}
                      </div>
                    </div>
                  </div>`;
                setTimeout(() => {
                  window.scrollTo({
                    top: document.body.scrollHeight,
                    behavior: "smooth",
                  });
                }, 200);
                return;
              }

              var safeStudentName = escapeHTML(data.name);
              var safeStudentGrade = escapeHTML(data.grade);
              var safeSeatNumber = escapeHTML(data.seatNumber);
              var safeCommittee = escapeHTML(data.committee);
              var safeFloor = escapeHTML(data.floor);

              var html = `
                <div class="student-info-appear">
                  <div id="capture-area">
                    <div id="export-header" style="display: none;">
                      <div style="display: flex; justify-content: center; align-items: center; margin-bottom: 25px; width: 100%; gap: 30px;">
                        <img src="logo_2.webp" crossorigin="anonymous" style="height: 140px; width: auto; object-fit: contain;" />
                        <img src="logo_1.webp" crossorigin="anonymous" style="height: 140px; width: auto; object-fit: contain;" />
                      </div>
                      <h4 style="color: #4a4e69; margin-top: 0; margin-bottom: 25px; border-bottom: 2px dashed #eee; padding-bottom: 15px; font-size: 22px;">مدرسة الشهيد محمود علي الخطيب الرسمية للغات</h4>
                    </div>
                    
                    <div class="id-card row-anim" style="animation-delay: 0.1s">
                      <div class="id-card-header-bar">
                        بطاقة رقم الجلوس واللجنة
                      </div>
                      <div class="id-card-body">
                        <div class="id-card-name">${safeStudentName}</div>
                        <div class="id-card-grade">الصف: ${safeStudentGrade}</div>
                        
                        <div class="id-details-list">
                          <div class="id-detail-row">
                            <span class="id-detail-label">رقم الجلوس</span>
                            <span class="id-detail-value highlight-seat">${safeSeatNumber}</span>
                          </div>
                          <div class="id-detail-row">
                            <span class="id-detail-label">اللجنة</span>
                            <span class="id-detail-value highlight-comm">${safeCommittee}</span>
                          </div>
                          <div class="id-detail-row">
                            <span class="id-detail-label">الدور</span>
                            <span class="id-detail-value">${safeFloor}</span>
                          </div>
                        </div>
                      </div>
                    </div>
                    
                    <div id="export-footer" style="display: none; margin-top: 30px; font-size: 16px; color: #4a4e69; text-align: center; font-weight: bold; border-top: 2px solid #eee; padding-top: 15px;">تصميم وتنفيذ : سمير هلال</div>
                  </div>
                  <button id="shareBtn" class="form-control btn-share" onclick="addRipple(event,this); shareResult('${safeStudentName}')"><span class="btn-text">📸 حفظ البيانات كصورة</span></button>
                  <div class="feedback-section">
                    <button id="showFeedbackBtn" class="form-control pulse-button" onclick="addRipple(event,this); toggleFeedbackForm()"><span class="btn-text">💬 تواصل معنا</span></button>
                    <div id="feedbackFormContainer" style="display: none; text-align: center;">
                      <h4 id="feedbackTitle" style="color: #333; margin-bottom: 15px; font-size: 18px;">تواصل معنا:</h4>
                      <textarea id="feedbackInput" rows="3" placeholder="اكتب رسالتك هنا..." lang="ar" dir="rtl"></textarea>
                      <button id="submitFeedbackBtn" class="form-control btn-success" onclick="addRipple(event,this); sendFeedback('${safeStudentName}', '${safeSeatNumber}', '${safeStudentGrade}')"><span class="btn-text">📨 إرسال الرسالة</span></button>
                      <div id="feedbackStatus" style="margin-top: 10px; font-weight: bold; text-align: center;"></div>
                    </div>
                  </div>
                </div>`;

              resultDiv.innerHTML = html;
            } else {
              resultDiv.innerHTML = `<div style='color:red; margin-top:15px;' class='student-info-appear'>${escapeHTML(
                data.message
              )}</div>`;
            }
            setTimeout(() => {
              window.scrollTo({
                top: document.body.scrollHeight,
                behavior: "smooth",
              });
            }, 200);
          })
          .catch(() => {
            loader.style.display = "none";
            searchBtn.disabled = false;
            idInput.disabled = false;
            searchBtn.classList.add("pulse-button");
            searchBtnText.innerText = "🔎 بحث";
            resultDiv.innerHTML =
              "<div style='color:red; margin-top:15px;' class='student-info-appear'>حدث خطأ في الاتصال بقاعدة البيانات. تأكد من اتصالك بالإنترنت.</div>";
          });
      }
    </script>
  </body>
</html>
