<!doctype html>
<html lang="ar" dir="rtl">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>البوابة الإلكترونية - مدرسة الشهيد محمود علي الخطيب</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800;900&display=swap"
      rel="stylesheet"
    />
    <meta
      property="og:title"
      content="البوابة الإلكترونية - مدرسة الشهيد محمود علي الخطيب"
    />
    <meta
      property="og:description"
      content="المنصة الرئيسية للخدمات الإلكترونية للمدرسة"
    />
    <meta
      property="og:image"
      content="https://mosamirhelal.com/alkhateeb/logo_3.webp"
    />
    <meta property="og:type" content="website" />
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <div
      class="dot"
      style="
        width: 90px;
        height: 90px;
        top: 8%;
        left: 4%;
        animation-duration: 6s;
      "
    ></div>
    <div
      class="dot"
      style="
        width: 60px;
        height: 60px;
        top: 20%;
        right: 6%;
        animation-duration: 8s;
        animation-delay: 1s;
      "
    ></div>
    <div
      class="dot"
      style="
        width: 120px;
        height: 120px;
        top: 55%;
        left: 2%;
        animation-duration: 10s;
        animation-delay: 2s;
      "
    ></div>
    <div
      class="dot"
      style="
        width: 50px;
        height: 50px;
        top: 70%;
        right: 4%;
        animation-duration: 7s;
        animation-delay: 0.5s;
      "
    ></div>
    <div
      class="dot"
      style="
        width: 80px;
        height: 80px;
        top: 38%;
        right: 11%;
        animation-duration: 9s;
        animation-delay: 3s;
      "
    ></div>

    <div class="container">
      <div class="top-logos">
        <img src="logo_2.webp" alt="شعار وزارة التربية والتعليم" />
        <div class="logo-divider"></div>
        <img src="logo_1.webp" alt="شعار مدرسة الشهيد محمود علي الخطيب" />
      </div>
      <div class="header-image">
        <img
          src="logo_3.webp"
          alt="مدرسة الشهيد محمود علي الخطيب الرسمية للغات"
        />
      </div>
      <div class="title-block">
        <h2>البوابة الإلكترونية</h2>
      </div>
      <div class="buttons-grid">
        <div class="section-label">بوابات الطلاب وأولياء الأمور</div>
        <a
          href="../alkhateeb-results/"
          class="portal-btn btn-results"
          onclick="navigateWithRipple(event, this, '../alkhateeb-results/')"
        >
          <div class="btn-content">
            <span class="btn-icon">📊</span>
            <span>بوابة بيانات ونتائج الطلاب</span>
          </div>
          <span class="btn-arrow">&#8592;</span>
          <div class="btn-shine"></div>
        </a>
        <a
          href="../alkhateeb-students/"
          class="portal-btn btn-students"
          onclick="navigateWithRipple(event, this, '../alkhateeb-students/')"
        >
          <div class="btn-content">
            <span class="btn-icon">📚</span>
            <span>بوابة بيانات لجان الطلاب</span>
          </div>
          <span class="btn-arrow">&#8592;</span>
          <div class="btn-shine"></div>
        </a>
        <a
          href="../alkhateeb-stars/"
          class="portal-btn btn-stars"
          onclick="navigateWithRipple(event, this, '../alkhateeb-stars/')"
        >
          <div class="btn-content">
            <span class="btn-icon">⭐</span>
            <span>بوابة العشرة الأوائل</span>
          </div>
          <span class="btn-arrow">&#8592;</span>
          <div class="btn-shine"></div>
        </a>
        <div class="section-label">بوابات المعلمين والإدارة</div>
        <a
          href="../alkhateeb-degrees/"
          class="portal-btn btn-degrees"
          onclick="navigateWithRipple(event, this, '../alkhateeb-degrees/')"
        >
          <div class="btn-content">
            <span class="btn-icon">📝</span>
            <span>بوابة إدخال الدرجات</span>
          </div>
          <span class="btn-arrow">&#8592;</span>
          <div class="btn-shine"></div>
        </a>
        <a
          href="../alkhateeb-hr/"
          class="portal-btn btn-hr"
          onclick="navigateWithRipple(event, this, '../alkhateeb-hr/')"
        >
          <div class="btn-content">
            <span class="btn-icon">👨‍🏫</span>
            <span>بوابة شؤون العاملين</span>
          </div>
          <span class="btn-arrow">&#8592;</span>
          <div class="btn-shine"></div>
        </a>
      </div>
      <div class="designer-credit">تصميم وتنفيذ : سمير هلال</div>
    </div>

    <script src="script.js" defer></script>
  </body>
</html>
