<!doctype html>
<html lang="ar" dir="rtl">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#0056b3" />
    <title>العشرة الأوائل - مدرسة الشهيد محمود علي الخطيب</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800&display=swap"
      rel="stylesheet"
    />
    <meta
      property="og:title"
      content="العشرة الأوائل - مدرسة الشهيد محمود علي الخطيب"
    />
    <meta property="og:description" content="قائمة أوائل الطلاب لكل صف دراسي" />
    <meta
      property="og:image"
      content="https://mosamirhelal.com/alkhateeb-stars/images/logo_3.webp"
    />
    <meta property="og:type" content="website" />
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <div
      class="dot"
      style="
        width: 90px;
        height: 90px;
        top: 8%;
        left: 4%;
        animation-duration: 6s;
      "
    ></div>
    <div
      class="dot"
      style="
        width: 60px;
        height: 60px;
        top: 20%;
        right: 6%;
        animation-duration: 8s;
        animation-delay: 1s;
      "
    ></div>
    <div
      class="dot"
      style="
        width: 120px;
        height: 120px;
        top: 55%;
        left: 2%;
        animation-duration: 10s;
        animation-delay: 2s;
      "
    ></div>
    <div
      class="dot"
      style="
        width: 50px;
        height: 50px;
        top: 70%;
        right: 4%;
        animation-duration: 7s;
        animation-delay: 0.5s;
      "
    ></div>
    <div
      class="dot"
      style="
        width: 80px;
        height: 80px;
        top: 38%;
        right: 11%;
        animation-duration: 9s;
        animation-delay: 3s;
      "
    ></div>
    <div class="container">
      <div class="top-logos">
        <img src="images/logo_2.webp" alt="شعار وزارة التربية والتعليم" />
        <img
          src="images/logo_1.webp"
          alt="شعار مدرسة الشهيد محمود علي الخطيب"
        />
      </div>
      <div class="header-image">
        <img
          src="images/logo_3.webp"
          alt="مدرسة الشهيد محمود علي الخطيب الرسمية للغات"
        />
      </div>
      <h2>🏆 نجوم مدرسة الشهيد محمود علي الخطيب 🏆</h2>
      <div id="gradeSelectorSection">
        <p
          style="
            color: #4a4e69;
            font-size: 15px;
            font-weight: 700;
            margin-bottom: 12px;
          "
        >
          اختر الصف الدراسي
        </p>
        <div class="select-wrapper">
          <select id="gradeSelect" class="grade-select">
            <option value="" disabled selected>-- اختر الصف --</option>
            <option value="ثالث ابتدائي">ثالث ابتدائي</option>
            <option value="رابع ابتدائي">رابع ابتدائي</option>
            <option value="خامس ابتدائي">خامس ابتدائي</option>
            <option value="سادس ابتدائي">سادس ابتدائي</option>
            <option value="أول اعدادي">أول اعدادي</option>
            <option value="ثاني اعدادي">ثاني اعدادي</option>
            <option value="ثالث اعدادي">ثالث اعدادي</option>
          </select>
        </div>
        <button
          id="showTopBtn"
          class="pulse-button"
          onclick="fetchTop10()"
          disabled
          style="margin-top: 5px"
        >
          <span class="btn-text">🏅 عرض العشرة الأوائل</span>
        </button>
      </div>
      <div class="loader" id="loader"></div>
      <div id="top10Result"></div>
      <div class="disclaimer-notice">
        <span>📝</span>
        ملاحظة: قائمة الأوائل قابلة للتعديل بناءً على نتائج التظلمات.
      </div>
      <div class="designer-credit">تصميم وتنفيذ : سمير هلال</div>
    </div>
    <div class="visit-counter">
      عدد زيارات الموقع : <span id="visitCount">...</span>
    </div>
    <script src="script.js" defer></script>
  </body>
</html>
