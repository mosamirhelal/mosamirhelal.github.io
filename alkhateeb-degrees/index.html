<!doctype html>
<html lang="ar" dir="rtl">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>إدخال الدرجات - مدرسة الشهيد محمود علي الخطيب</title>
    <meta
      property="og:title"
      content="إدخال الدرجات - مدرسة الشهيد محمود علي الخطيب"
    />
    <meta
      property="og:description"
      content="بوابة المعلمين لإدخال درجات الطلاب"
    />
    <meta
      property="og:image"
      content="https://mosamirhelal.com/alkhateeb-degrees/logo_3.webp"
    />
    <meta property="og:type" content="website" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <div
      class="dot"
      style="
        width: 90px;
        height: 90px;
        top: 8%;
        left: 4%;
        animation-duration: 6s;
      "
    ></div>
    <div
      class="dot"
      style="
        width: 60px;
        height: 60px;
        top: 20%;
        right: 6%;
        animation-duration: 8s;
        animation-delay: 1s;
      "
    ></div>
    <div
      class="dot"
      style="
        width: 120px;
        height: 120px;
        top: 55%;
        left: 2%;
        animation-duration: 10s;
        animation-delay: 2s;
      "
    ></div>
    <div
      class="dot"
      style="
        width: 50px;
        height: 50px;
        top: 70%;
        right: 4%;
        animation-duration: 7s;
        animation-delay: 0.5s;
      "
    ></div>
    <div
      class="dot"
      style="
        width: 80px;
        height: 80px;
        top: 38%;
        right: 11%;
        animation-duration: 9s;
        animation-delay: 3s;
      "
    ></div>

    <div class="container" id="loginContainer">
      <div class="top-logos">
        <img src="logo_2.webp" alt="وزارة التربية والتعليم" />
        <img src="logo_1.webp" alt="شعار المدرسة" />
      </div>
      <div class="header-image">
        <img src="logo_3.webp" alt="مدرسة الشهيد محمود علي الخطيب" />
      </div>
      <h2>تسجيل الدخول للمعلمين</h2>
      <input
        type="text"
        id="usernameInput"
        class="form-control"
        placeholder="اسم المستخدم"
        dir="rtl"
        onkeydown="
          if (event.key === 'Enter') {
            event.preventDefault();
            document.getElementById('passwordInput').focus();
          }
        "
      />
      <input
        type="password"
        id="passwordInput"
        class="form-control"
        placeholder="كلمة المرور"
        dir="ltr"
        onkeydown="
          if (event.key === 'Enter') {
            event.preventDefault();
            doLogin();
          }
        "
      />
      <button
        id="loginBtn"
        class="form-control pulse-button"
        onclick="
          addRipple(event, this);
          doLogin();
        "
      >
        <span class="btn-text">دخول المنصة</span>
      </button>
      <div class="loader" id="loginLoader"></div>
      <div id="loginMessage" class="status-message"></div>
      <div class="designer-credit">تصميم وتنفيذ : سمير هلال</div>
    </div>

    <div class="container" id="mainContainer" style="display: none">
      <div class="header-actions">
        <span class="teacher-name" id="teacherNameDisplay"></span>
        <button class="btn-logout" onclick="showLogoutConfirm()">
          تسجيل خروج
        </button>
      </div>
      <div class="top-logos">
        <img src="logo_2.webp" alt="وزارة التربية والتعليم" />
        <img src="logo_1.webp" alt="شعار المدرسة" />
      </div>
      <div class="header-image">
        <img src="logo_3.webp" alt="مدرسة الشهيد محمود علي الخطيب" />
      </div>
      <h2>بوابة إدخال الدرجات</h2>

      <select id="gradeSelect" class="form-control" onchange="showSections()">
        <option value="">-- اختر الصف الدراسي --</option>
        <option value="ثالث ابتدائي">الصف الثالث الابتدائي</option>
        <option value="رابع ابتدائي">الصف الرابع الابتدائي</option>
        <option value="خامس ابتدائي">الصف الخامس الابتدائي</option>
        <option value="سادس ابتدائي">الصف السادس الابتدائي</option>
        <option value="أول اعدادي">الصف الأول الإعدادي</option>
        <option value="ثاني اعدادي">الصف الثاني الإعدادي</option>
      </select>

      <select
        id="sectionSelect"
        class="form-control"
        style="display: none"
        onchange="showSubjects()"
      >
        <option value="">-- اختر رقم الفصل --</option>
        <option value="1">1</option>
        <option value="2">2</option>
        <option value="3">3</option>
        <option value="4">4</option>
        <option value="5">5</option>
        <option value="6">6</option>
      </select>

      <select
        id="subjectSelect"
        class="form-control"
        style="display: none"
        onchange="showEvaluations()"
      >
        <option value="">-- اختر المادة --</option>
      </select>

      <select
        id="evaluationSelect"
        class="form-control"
        style="display: none"
        onchange="showSearchBtn()"
      >
        <option value="">-- اختر التقييم --</option>
        <option value="تقييم_مارس">تقييمات شهر مارس</option>
        <option value="امتحان_مارس">امتحانات شهر مارس</option>
        <option value="تقييم_أبريل">تقييمات شهر أبريل</option>
        <option value="امتحان_أبريل">امتحانات شهر أبريل</option>
      </select>

      <button
        id="searchBtn"
        class="form-control pulse-button"
        style="display: none"
        onclick="
          addRipple(event, this);
          fetchStudents();
        "
      >
        <span class="btn-text">🔎 عرض كشف الطلاب</span>
      </button>

      <div id="inlineMessage" class="status-message"></div>
      <div class="loader" id="mainLoader"></div>

      <div id="bulkScoreDiv" class="bulk-wrapper">
        <span style="font-weight: bold; color: #0056b3; font-size: 15px"
          >تعميم درجة:</span
        >
        <input
          type="text"
          id="bulkScoreInput"
          inputmode="numeric"
          class="score-input"
          placeholder="الدرجة"
          style="max-width: 80px; margin: 0"
        />
        <button
          class="btn-danger"
          onclick="
            addRipple(event, this);
            showBulkConfirm();
          "
        >
          <span class="btn-text">⚡ تطبيق</span>
        </button>
        <!--
        <button
          class="btn-clear-all"
          onclick="addRipple(event, this); showClearConfirm()"
        >
          <span class="btn-text">🗑️ تفريغ الكل</span>
        </button>
        <button
          class="btn-absent-all"
          onclick="addRipple(event, this); showAbsentConfirm()"
        >
          <span class="btn-text">🚫 غياب للكل</span>
        </button>
        <button
          class="btn-reset-all"
          onclick="addRipple(event, this); showPresentConfirm()"
        >
          <span class="btn-text">🔄 حضور للكل</span>
        </button>
        -->
      </div>

      <div id="searchContainer">
        <input
          type="text"
          id="liveSearchInput"
          class="form-control"
          placeholder="🔎 بحث باسم الطالب أو الرقم القومي..."
          style="max-width: 100%; margin: 0"
          oninput="filterTable()"
        />
      </div>

      <div id="tableControls">
        <div style="display: flex; align-items: center; gap: 10px">
          <span style="font-weight: bold; color: #0056b3; font-size: 15px"
            >عرض بالصفحة:</span
          >
          <select
            id="rowsPerPageSelect"
            class="form-control"
            style="max-width: 80px; margin: 0; padding: 8px; text-align: center"
            onchange="updateRowsPerPage()"
          >
            <option value="10">10</option>
            <option value="20">20</option>
            <option value="30">30</option>
            <option value="40">40</option>
            <option value="50" selected>50</option>
            <option value="10000">الكل</option>
          </select>
        </div>
        <div
          id="studentCountInfo"
          style="font-weight: bold; color: #4a4e69; font-size: 14px"
        ></div>
      </div>

      <table id="studentsTable">
        <thead>
          <tr>
            <th style="width: 50px">م</th>
            <th>اسم الطالب</th>
            <th>الدرجة</th>
          </tr>
        </thead>
        <tbody id="studentsBody"></tbody>
      </table>

      <div id="paginationDiv" class="pagination-controls">
        <button
          id="prevBtn"
          class="page-btn"
          onclick="
            addRipple(event, this);
            changePage(-1);
          "
        >
          <span class="btn-text">السابق</span>
        </button>
        <span class="page-info"
          >صفحة <span id="currentPageNum">1</span> من
          <span id="totalPagesNum">1</span></span
        >
        <button
          id="nextBtn"
          class="page-btn"
          onclick="
            addRipple(event, this);
            changePage(1);
          "
        >
          <span class="btn-text">التالي</span>
        </button>
      </div>

      <button
        id="saveBtn"
        class="form-control btn-success pulse-success"
        style="display: none"
        onclick="
          addRipple(event, this);
          saveData();
        "
      >
        <span class="btn-text">💾 حفظ الدرجات</span>
      </button>

      <div id="saveMessage" class="status-message"></div>
      <div class="designer-credit">تصميم وتنفيذ : سمير هلال</div>
    </div>

    <div id="customModal" class="modal-overlay">
      <div class="modal-content">
        <div class="modal-title" id="modalTitleText"></div>
        <div class="modal-buttons">
          <button
            class="btn-modal-confirm"
            onclick="
              addRipple(event, this);
              executeModalAction();
            "
          >
            نعم
          </button>
          <button
            class="btn-modal-cancel"
            onclick="
              addRipple(event, this);
              closeBulkModal();
            "
          >
            لا
          </button>
        </div>
      </div>
    </div>

    <script src="script.js" defer></script>
  </body>
</html>
