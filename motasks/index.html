<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Dental Schedule | Mosamirhelal</title>
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Cairo:wght@400;600&display=swap"
      rel="stylesheet"
    />

    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <div class="container">
      <header>
        <h1><span>🗓</span> Course Schedule</h1>
        <div id="statusMsg" class="status-badge">🔄 Connecting...</div>
      </header>

      <div class="table-wrapper">
        <table id="scheduleTable">
          <thead>
            <tr>
              <th style="width: 30%">Name</th>
              <th style="width: 15%">Date</th>
              <th style="width: 20%">Topic</th>
              <th style="width: 15%">Type</th>
              <th style="width: 10%; text-align: center">Done?</th>
              <th style="width: 10%; text-align: center">Actions</th>
            </tr>
          </thead>
          <tbody></tbody>
        </table>
      </div>

      <div style="margin-top: 20px; display: flex; justify-content: center">
        <button id="addBtn" class="btn-add"><span>+</span> Add New Task</button>
      </div>
    </div>

    <script type="module" src="script.js"></script>
  </body>
</html>
